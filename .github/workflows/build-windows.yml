name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Build
        shell: bash
        run: |
          qmake AbsoluteCinema.pro CONFIG+=release
          mingw32-make -j2

      - name: Package
        shell: bash
        run: |
          QT=$(cygpath -u "$QT_ROOT_DIR")
          mkdir -p dist/platforms
          cp release/AbsoluteCinema.exe dist/
          cp "$QT/bin/Qt5Core.dll" "$QT/bin/Qt5Gui.dll" "$QT/bin/Qt5Widgets.dll" dist/
          cp "$QT/bin/libgcc_s_seh-1.dll" "$QT/bin/libstdc++-6.dll" "$QT/bin/libwinpthread-1.dll" dist/
          cp "$QT/plugins/platforms/qwindows.dll" dist/platforms/
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: AbsoluteCinema-windows
          path: dist
